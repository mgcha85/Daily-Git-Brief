version: "3.8"

services:
  app:
    image: ${APP_IMAGE:-localhost/daily-git-brief:latest}
    container_name: daily-git-brief
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
